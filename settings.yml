use_default_settings: true

search:
  formats:
    - html
    - json

# Bounded upstream requests; provider suspensions and Retry-After stay enabled.
# No retries on blocks, proxy rotation, or paid search API credentials.
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0

# Temporary free source verified with real album/shop searches from this
# Render service on 23 October 2026. Yep currently denies server requests.
# Keep unavailable engines disabled; retain normal provider backoff behavior.
engines:
  - name: resulthunter
    disabled: false
    categories: [general, web]
    timeout: 6.0
  - name: yep
    disabled: true
    categories: [general, web]
    timeout: 6.0
  - name: duckduckgo
    disabled: true
    timeout: 6.0
  - name: google cse
    disabled: true
  - name: brave
    disabled: true
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
